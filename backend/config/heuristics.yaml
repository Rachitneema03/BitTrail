# Attribution thresholds and weights. Tune against scripts/eval_hide_and_seek.py.
# The SHA-256 of this file is recorded in every evidence manifest ("ruleset_sha256").

deposit_sweep:
  min_out_share: 0.9            # share of outflow (USD) going to one labelled exchange hot wallet
  max_out_counterparties: 3     # deposit addresses talk to very few destinations
  max_sweep_delay_hours: 24     # traced funds' arrival -> first sweep to the hot wallet

exchange_cluster:
  # An unlabelled wallet that sends most of its outflow to ONE exchange's labelled wallets, while talking to
  # more counterparties than a deposit address would, is inferred to be part of that exchange's cluster.
  min_out_share: 0.6

dust:
  # Adaptive dust filter: per wallet, ignore transfers below max(TRACE_MIN_USD, relative_share x value reaching it),
  # capped at max_floor_usd. If the ignored transfers carry >= structuring_share of the outflow, they are not dust
  # (possible structuring): the floor drops back to TRACE_MIN_USD and the wallet is flagged.
  adaptive: true
  relative_share: 0.005
  max_floor_usd: 1000
  structuring_share: 0.2
  poisoning_usd: 1.0            # transfers below this are counted as likely address-poisoning dust

crosschain_probe:
  # Every new recipient carrying >= min_share of the traced value is checked against the bridge / swap trackers
  # (by the deposit transaction hash) before its own outflow is followed.
  min_share: 0.01

coinjoin:
  # Bitcoin equal-output CoinJoin (Wasabi / Whirlpool / JoinMarket style): treated as a mixer, trail stops.
  min_inputs: 5
  min_equal_outputs: 5          # outputs of exactly the same value
  min_equal_share: 0.4          # ... making up at least this share of all outputs

service_like:
  # Adapters return a sample of the latest <=200 transfers, so thresholds are sample-based.
  min_sample_counterparties: 60
  full_page_within_days: 3      # a full 200-transfer page inside this many days = high-throughput service
  min_collection_senders: 20    # a wallet that pays nothing out but receives from >= N distinct senders

weights:
  label_tier: 0.9
  sweep: 0.7
  ext_tag: 0.5
  history: 0.5                  # same address attributed to this VASP in another case / verified by the VASP
  value: 0.4
  recency: 0.2

label_tier_score:
  verified: 1.0
  published: 0.95
  curated: 0.8
  community: 0.6
  inferred: 0.5

path_factor:
  clean: 1.0
  bridge: 0.7                   # bridge on path with unknown continuity; with a continuity score c: 0.5 + 0.5*c
  mixer: 0.0

continuity:                     # cross-chain continuity score = weighted sum of these components
  amount: 0.35                  # USD in vs USD out similarity
  time: 0.25                    # 1 within full_minutes, falling to 0 at zero_hours
  bridge: 0.3                   # bridge tracker confirms the pair of transactions
  destination: 0.1              # destination is not a high-throughput service
  full_minutes: 10
  zero_hours: 24
  match_window_hours: 6         # unconfirmed fallback: same EVM address, other EVM chain, arrival within this window
  max_fee_share: 0.03           # ... and no more than 3% less than what entered the bridge

recency:
  full_days: 7
  zero_days: 90

actionability:
  fiu_and_sahyog: 1.0
  fiu_only: 0.9
  sahyog_only: 0.85
  foreign_le_portal: 0.6
  unknown: 0.3

typology:
  split_min_recipients: 3       # one wallet paying >= N traced recipients within split_window_hours
  split_window_hours: 24
  rapid_hop_minutes: 60         # a hop made within this many minutes of the funds arriving
  rapid_min_hops: 2
  layering_min_intermediaries: 3
  passthrough_min_share: 0.9    # forwards >= 90% of what it received ...
  passthrough_max_hours: 24     # ... within this many hours
  passthrough_min_wallets: 2

risk_weights:                   # overall risk = weighted mean of the six axes (0-100)
  velocity: 0.15
  layering: 0.2
  cross_chain: 0.15
  proliferation: 0.1
  vasp_exposure: 0.15
  historical: 0.25

risk_levels:                    # overall score thresholds
  medium: 30
  high: 55
  critical: 75

requests:
  approval_below_confidence: 0.7  # an IO's request on a weaker attribution needs an I4C analyst's approval to send

alerts_default:                 # initial alert rules (editable in the UI, stored in the settings table)
  large_transfer_usd: 5000
  new_activity: true
  score_increase_points: 5
  new_relationship: true
  risk_patterns: true
  min_risk_level: high
